{% load i18n %}<div class="field{% if wide %} span-2{% endif %}"><label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="muted">*</span>{% endif %}</label>{% if chips %}<div class="tick-chips">{{ f }}</div>{% else %}{{ f }}{% endif %}{% if f.help_text %}<small class="muted">{{ f.help_text }}</small>{% endif %}{% for e in f.errors %}<div class="error small">{{ e }}</div>{% endfor %}</div>
