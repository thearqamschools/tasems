{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Result card" %}{% endblock %}
{% block content %}
<div class="actions no-print">

</div>
<div class="diary-preview">{% include "exams/_card.html" %}</div>
{% endblock %}
