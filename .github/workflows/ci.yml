name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasems
          POSTGRES_PASSWORD: tasems
          POSTGRES_DB: tasems
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      FIELD_ENCRYPTION_KEY: Y2ktb25seS1ub3Qtc2VjcmV0LWtleS0zMmJ5dGVzISE=
      DATABASE_URL: postgres://tasems:tasems@localhost:5432/tasems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
